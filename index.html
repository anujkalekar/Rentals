<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Rental System</title>
    <link rel="stylesheet" href="style.css">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h1>Car & Bike Rental System</h1>

<div class="container">

    <!-- Swift Car -->
    <div class="card">
        <img src="https://imgd.aeplcdn.com/1920x1080/n/cw/ec/159099/swift-exterior-right-front-three-quarter-31.png" alt="Swift Car">
        <h2>Swift Car</h2>
        <p>Price: ₹1000/day</p>
        <button onclick="rentVehicle('Swift Car',1000)">Rent Now</button>
        <button onclick="goToDetails('Swift Car',1000,'https://imgd.aeplcdn.com/1920x1080/n/cw/ec/159099/swift-exterior-right-front-three-quarter-31.png')">More Info</button>
    </div>

    <!-- Honda Bike -->
    <div class="card">
        <img src="https://imgd.aeplcdn.com/664x374/n/cw/ec/1/versions/--dlx-obd-2b1743781473451.jpg" alt="Honda Bike">
        <h2>Honda Bike</h2>
        <p>Price: ₹500/day</p>
        <button onclick="rentVehicle('Honda Bike',500)">Rent Now</button>
        <button onclick="goToDetails('Honda Bike',500,'https://imgd.aeplcdn.com/664x374/n/cw/ec/1/versions/--dlx-obd-2b1743781473451.jpg')">More Info</button>
    </div>

    <!-- i20 Car -->
    <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4ygqdlUSis2SSQm-PWOOir-Xt_uBT7h_FlA&s" alt="i20 Car">
        <h2>i20 Car</h2>
        <p>Price: ₹1200/day</p>
        <button onclick="rentVehicle('i20 Car',1200)">Rent Now</button>
        <button onclick="goToDetails('i20 Car',1200,'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4ygqdlUSis2SSQm-PWOOir-Xt_uBT7h_FlA&s')">More Info</button>
    </div>

</div>

<footer>
    <p>&copy; 2025 Car & Bike Rental System | All Rights Reserved</p>
    <p>Contact: +91 9359407260 | Email: support@bikerentel.com</p>
</footer>

<script>
    // Supabase Setup
    const supabaseUrl = "https://sclsyqjoebcvvzfecanr.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjbHN5cWpvZWJjdnZ6ZmVjYW5yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NDk2NzcsImV4cCI6MjA5MzAyNTY3N30.fAd_1wO-6LeIgX4dWiVlk1nAsWbTMRQGFy_eCnYGW6o";

    const { createClient } = supabase;
    const client = createClient(supabaseUrl, supabaseKey);

    // 🔥 UPDATED Rent Function
    async function rentVehicle(vehicleName, price) {

        // Ask days
        let days = prompt("How many days do you want to rent?");
        if (!days || isNaN(days) || days <= 0) {
            alert("Please enter a valid number of days!");
            return;
        }
        days = parseInt(days);

        // Ask rent date
        let rentDate = prompt("Enter Rent Date (YYYY-MM-DD):");
        if (!rentDate) {
            alert("Please enter a valid date!");
            return;
        }

        // Calculate total
        let totalPrice = price * days;

        // Confirmation
        let confirmBooking = confirm(
            `Vehicle: ${vehicleName}
Days: ${days}
Rent Date: ${rentDate}
Total Price: ₹${totalPrice}

Confirm booking?`
        );

        if (!confirmBooking) return;

        try {
            const { data, error } = await client
                .from("rentals")
                .insert([
                    {
                        customer_name: "Guest User",
                        customer_phone: "9999999999",
                        vehicle_name: vehicleName,
                        price_per_day: price,
                        total_days: days,
                        rent_date: rentDate,
                        total_price: totalPrice,
                        status: "Booked"
                    }
                ]);

            if (error) throw error;

            alert("✅ Booking Confirmed!\nTotal: ₹" + totalPrice);
            console.log(data);

        } catch (error) {
            alert("❌ Error: " + error.message);
            console.error(error);
        }
    }

    // Go to Details Page
    function goToDetails(name, price, image) {
        window.location.href =
            `details.html?name=${encodeURIComponent(name)}&price=${price}&image=${encodeURIComponent(image)}`;
    }
</script>

</body>
</html>
